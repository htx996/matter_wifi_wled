name: Build & Release

on:
  push:
    branches: [fix/wled-state-sync-s3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wled-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32s3
            flash: 8MB
          - env: esp32s3_16mb
            flash: 16MB
          - env: esp32c3_4mb
            flash: 4MB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compatible PlatformIO Core
        run: |
          python -m pip install 'platformio==6.1.19'
          pio --version
      - name: Configure clean ESP-IDF Flash settings
        run: |
          rm -f sdkconfig.${{ matrix.env }}
          printf '\nCONFIG_ESPTOOLPY_FLASHSIZE_${{ matrix.flash }}=y\nCONFIG_ESPTOOLPY_FLASHSIZE="${{ matrix.flash }}"\n' >> sdkconfig.defaults
      - name: Build firmware
        run: pio run -e ${{ matrix.env }}
      - name: Verify Flash configuration and prepare artifacts
        run: |
          set -eu
          env_name='${{ matrix.env }}'
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE' "sdkconfig.${env_name}"
          grep -Fx 'CONFIG_ESPTOOLPY_FLASHSIZE="${{ matrix.flash }}"' "sdkconfig.${env_name}"
          mkdir -p release
          for f in bootloader.bin partitions.bin firmware.bin; do
            test -s ".pio/build/$env_name/$f"
            cp ".pio/build/$env_name/$f" release/
          done
          if [ -f ".pio/build/$env_name/boot_app0.bin" ]; then
            cp ".pio/build/$env_name/boot_app0.bin" release/
          fi
          python - "$env_name" <<'PY'
          import sys
          from pathlib import Path
          import struct
          target = sys.argv[1]
          release = Path("release")
          flash_code, chip_id, app_limit = {"esp32s3": (3, 9, 0x300000), "esp32s3_16mb": (4, 9, 0x300000), "esp32c3_4mb": (2, 5, 0x360000)}[target]
          boot, part, app = [(release / f"{name}.bin").read_bytes() for name in ("bootloader", "partitions", "firmware")]
          for data in (boot, app):
              assert data[0] == 0xe9 and data[3] >> 4 == flash_code
              assert struct.unpack_from("<H", data, 12)[0] == chip_id
          assert len(boot) <= 0x8000 and len(part) <= 0x1000 and len(app) <= app_limit
          segments = [(0, boot), (0x8000, part), (0x10000, app)]
          if target != "esp32c3_4mb" and (release / "boot_app0.bin").exists():
              segments.insert(2, (0xe000, (release / "boot_app0.bin").read_bytes()))
          elif target == "esp32c3_4mb":
              (release / "boot_app0.bin").unlink(missing_ok=True)
          image = bytearray()
          for offset, data in segments:
              assert len(image) <= offset
              image.extend(b"\xff" * (offset-len(image)))
              image.extend(data)
          for offset, data in segments:
              assert image[offset:offset+len(data)] == data
          (release / f"{target}-merged.bin").write_bytes(image)
          print(f"{target}: merged {len(image)} bytes at 0x0")
          PY
          git rev-parse HEAD > release/build-commit.txt
          printf '%s\n' "$env_name" > release/build-target.txt
          (cd release && sha256sum *.bin > SHA256SUMS)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: release/
          if-no-files-found: error
