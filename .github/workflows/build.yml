name: Build & Release

on:
  push:
    branches: [fix/wled-state-sync-s3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wled-s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32s3
            flash: 8MB
          - env: esp32s3_16mb
            flash: 16MB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compatible PlatformIO Core
        run: |
          python -m pip install 'platformio==6.1.19'
          pio --version
      - name: Configure clean ESP-IDF Flash settings
        run: |
          rm -f sdkconfig.${{ matrix.env }}
          printf '\nCONFIG_ESPTOOLPY_FLASHSIZE_${{ matrix.flash }}=y\nCONFIG_ESPTOOLPY_FLASHSIZE="${{ matrix.flash }}"\n' >> sdkconfig.defaults
      - name: Build firmware
        run: pio run -e ${{ matrix.env }}
      - name: Verify Flash configuration and prepare artifacts
        run: |
          set -eu
          env_name='${{ matrix.env }}'
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE' "sdkconfig.${env_name}"
          grep -Fx 'CONFIG_ESPTOOLPY_FLASHSIZE="${{ matrix.flash }}"' "sdkconfig.${env_name}"
          mkdir -p release
          for f in bootloader.bin partitions.bin firmware.bin; do
            test -s ".pio/build/$env_name/$f"
            cp ".pio/build/$env_name/$f" release/
          done
          if [ -f ".pio/build/$env_name/boot_app0.bin" ]; then
            cp ".pio/build/$env_name/boot_app0.bin" release/
          fi
          git rev-parse HEAD > release/build-commit.txt
          printf '%s\n' "$env_name" > release/build-target.txt
          (cd release && sha256sum *.bin > SHA256SUMS)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: release/
          if-no-files-found: error
